
name: milkapp-workflow

on:
  workflow_dispatch:

jobs:
  build_and_push: 
    runs-on: [self-hosted, windows]

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: milkapp
      DOCKER_TAG: ${{ github.sha }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        shell: powershell
        run: |
          echo "Building local Docker image..."

          docker build `
            --file appbox/milkapp/Dockerfile `
            . `
            --tag "${{ env.IMAGE_NAME }}:local" `
            --tag "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}" `
            --tag "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

          echo "Docker image built successfully"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Push Docker Images
        shell: powershell
        run: |
          echo "Pushing images to Docker Hub..."

          docker push "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          docker push "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

          echo "Successfully pushed to Docker Hub"

      - name: Check Kubernetes
        shell: powershell
        run: |
          echo "Checking Kubernetes connection..."

          kubectl config current-context
          kubectl get nodes
          kubectl get pods

          echo "Kubernetes connection successful"
          kubectl get deployment milkapp
          kubectl get pods -l app=milkapp
          kubectl get service milkapp-service
    
