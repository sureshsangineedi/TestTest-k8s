name: Build & Deploy Idea App

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: [self-hosted, linux]  # Use your self-hosted runner label

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      IMAGE_NAME: idea

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t $DOCKER_HUB_USERNAME/$IMAGE_NAME:latest .
          docker push $DOCKER_HUB_USERNAME/$IMAGE_NAME:latest

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f appbox/idea/Dockerfile
          
