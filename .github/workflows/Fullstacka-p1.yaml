name: Fullstack CI/CD for p1

on:
  # push:
    # branches:
      # - main
  workflow_dispatch: # Allows manual triggering from the GitHub UI


jobs:
  build-and-deploy:
    runs-on: self-hosted    # 👈 changed from ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        logout: false

    - name: Build and push backend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest ./appbox/p1/backend
        docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest

    - name: Build and push frontend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./appbox/p1/frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

    # - name: Set up kubectl
    #   uses: azure/setup-kubectl@v3
    #   with:
    #     version: 'v1.27.3' 

    - name: Deploy backend and frontend to Kubernetes
      run: |
        kubectl apply -f appbox/p1/k8s/backend-deployment.yaml
        kubectl apply -f appbox/p1/k8s/frontend-deployment.yaml
