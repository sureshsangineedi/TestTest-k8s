name: Docker Build (Local + Push to Docker Hub) for gym

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build_and_push:
    runs-on: [self-hosted, windows]

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: gym-app
      DOCKER_TAG: ${{ github.sha }}

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔨 Build Docker Image (Local)
        run: |
          echo "Building local Docker image..."
          docker build `
            --file appbox/gym/Dockerfile `
            . `
            --tag ${{ env.IMAGE_NAME }}:local `
            --tag ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }} `
            --tag ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          
          echo "✅ Local image built successfully: ${{ env.IMAGE_NAME }}:local"

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true 

      - name: ⬆️ Push Docker Images to Docker Hub
        run: |
          echo "Pushing images to Docker Hub..."
          docker push ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          docker push ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Successfully pushed to Docker Hub"
