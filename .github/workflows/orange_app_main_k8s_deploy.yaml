name: orangeapp CI/CD

on:
  workflow_dispatch:   # Trigger manually from GitHub Actions tab

jobs:
  build-deploy:
    runs-on: self-hosted   # Needs Docker + kubectl installed

    steps:
      # 1. Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      # 3. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./appbox/oragneapp         # 👈 folder with Dockerfile + index.html
          file: ./appbox/oragneapp/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/orangeapp:latest

      # 4. Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f appbox/oragneapp/k8s/deployment.yaml
          echo "----- Pods -----"
          kubectl get pods -l app=oragneapp
          echo "----- Services -----"
          kubectl get svc -l app=oragneapp
