name: (Prometheus + Grafana)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted   # your Windows runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # -------------------------------------------------------------
      # FIX: Install kubectl on Windows (ZIP only, NO tar.gz)
      # -------------------------------------------------------------
      - name: Install kubectl (Windows Safe)
        run: |
          curl.exe -LO "https://dl.k8s.io/release/v1.30.0/bin/windows/amd64/kubectl.exe"
          mkdir C:\tools\kubectl
          move kubectl.exe C:\tools\kubectl\kubectl.exe
          echo "C:\tools\kubectl" | Out-File -Append -FilePath $env:GITHUB_PATH

      # -------------------------------------------------------------
      # FIX: Install Helm using ZIP (NO tar.gz)
      # -------------------------------------------------------------
      - name: Install Helm (Windows Safe)
        run: |
          curl.exe -LO "https://get.helm.sh/helm-v3.14.0-windows-amd64.zip"
          Expand-Archive helm-v3.14.0-windows-amd64.zip -DestinationPath .
          mkdir C:\tools\helm
          move windows-amd64\helm.exe C:\tools\helm\helm.exe
          echo "C:\tools\helm" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Verify Tools
        run: |
          kubectl version --client
          helm version

      # -------------------------------------------------------------
      # Add Helm Repos
      # -------------------------------------------------------------
      - name: Add Prometheus Community Repo
        run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

      - name: Add Grafana Repo
        run: helm repo add grafana https://grafana.github.io/helm-charts

      - name: Update Helm Repos
        run: helm repo update

      # -------------------------------------------------------------
      # Minimal resource values file
      # -------------------------------------------------------------
      - name: Create minimal-values.yaml
        run: |
          cat <<EOF > minimal-values.yaml
          grafana:
            enabled: true
            adminPassword: "admin"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 256Mi
            service:
              type: NodePort
              nodePort: 32000

          prometheus:
            prometheusSpec:
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 200m
                  memory: 512Mi
              retention: 12h

          alertmanager:
            enabled: false

          kubeStateMetrics:
            enabled: false

          nodeExporter:
            enabled: false
          EOF

      # -------------------------------------------------------------
      # Install Prometheus + Grafana
      # -------------------------------------------------------------
      - name: Install kube-prometheus-stack (minimal)
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack `
            --namespace monitoring --create-namespace `
            -f minimal-values.yaml
