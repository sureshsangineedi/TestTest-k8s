name: Build & Deploy Water Reminder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/water-reminder:latest appbox/drinkingwater

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/water-reminder:latest

      - name: Verify Kubernetes Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f appbox/drinkingwater/k8s/k8s-deployment.yaml
          kubectl rollout status deployment/water-reminder
