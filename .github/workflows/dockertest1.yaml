name: dockertesting1

on:
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: [self-hosted, windows]

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: sangineedi

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔨 Build Docker Image (Local)
        shell: powershell
        run: |
          docker build `
            --file appbox/dockertest/Dockerfile `
            . `
            --tag "$env:IMAGE_NAME:local" `
            --tag "$env:DOCKER_HUB_USERNAME/$env:IMAGE_NAME:v1" `
            --tag "$env:DOCKER_HUB_USERNAME/$env:IMAGE_NAME:latest"

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: ⬆️ Push Docker Images to Docker Hub
        shell: powershell
        run: |
          docker push "$env:DOCKER_HUB_USERNAME/$env:IMAGE_NAME:v1"
          docker push "$env:DOCKER_HUB_USERNAME/$env:IMAGE_NAME:latest"
          echo "✅ Successfully pushed v1 and latest"
