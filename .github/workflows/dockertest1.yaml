name: dockertesting1

on:
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: [self-hosted, windows]

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: sangineedi

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Generate Short SHA (12 chars)
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: 🔨 Build Docker Image (Local)
        run: |
          echo "Using SHA Tag: $SHORT_SHA"
          docker build `
            --file appbox/dockertest/Dockerfile `
            . `
            --tag ${{ env.IMAGE_NAME }}:local `
            --tag ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:$SHORT_SHA `
            --tag ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: ⬆️ Push Docker Images to Docker Hub
        run: |
          echo "Pushing Docker images..."
          docker push ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:$SHORT_SHA
          docker push ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Successfully pushed using tag: $SHORT_SHA"
