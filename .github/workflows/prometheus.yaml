name: Prometheus & Grafana (simple - windows)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add helm repos
        shell: pwsh
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Install Prometheus (NodePort 32001, no persistence)
        shell: pwsh
        run: |
          helm upgrade --install prometheus prometheus-community/prometheus `
            --set server.service.type=NodePort `
            --set server.service.nodePort=32001 `
            --set server.persistentVolume.enabled=false

      - name: Install Grafana (NodePort 32000, no persistence)
        shell: pwsh
        run: |
          helm upgrade --install grafana grafana/grafana `
            --set service.type=NodePort `
            --set service.nodePort=32000 `
            --set persistence.enabled=false

      - name: Get Grafana admin password (PowerShell decode)
        shell: pwsh
        run: |
          # wait up to 60s for secret
          $ready = $false
          for ($i=0; $i -lt 12; $i++) {
            if (kubectl get secret grafana -o name -ErrorAction SilentlyContinue) { $ready = $true; break }
            Start-Sleep -Seconds 5
          }
          if ($ready) {
            $encoded = kubectl get secret grafana -o jsonpath="{.data.admin-password}"
            if ($encoded) {
              $bytes = [System.Convert]::FromBase64String($encoded)
              $decoded = [System.Text.Encoding]::UTF8.GetString($bytes)
              Write-Host "Grafana admin password: $decoded"
            } else {
              Write-Host "Grafana secret found but admin-password is empty."
            }
          } else {
            Write-Host "Grafana secret not found after waiting."
          }
