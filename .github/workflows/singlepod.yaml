name: Deploy Single Pod to Kubernetes

on:
  workflow_dispatch:   # Manual trigger

jobs:
  deploy:
    runs-on: self-hosted   # Using your self-hosted runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy Nginx Pod
        shell: bash
        run: |
          cat <<EOF | kubectl apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
EOF

      - name: Deploy NodePort Service
        shell: bash
        run: |
          cat <<EOF | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
EOF

      - name: Verify Deployment
        shell: bash
        run: |
          kubectl get pods -o wide
          kubectl get svc nginx-service -o wide
