name: free-ebooks CI/CD

on:
  workflow_dispatch:   # trigger manually from GitHub Actions tab

jobs:
  build-deploy:
    runs-on: self-hosted   # ensure this runner has Docker + kubectl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false   # 👈 prevents logout issue

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./appbox/free-ebooks
          file: ./appbox/free-ebooks/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/free-ebooks:v2

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f appbox/free-ebooks/k8s/free-ebooks.yaml
          echo "----- Pods -----"
          kubectl get pods -o wide
          echo "----- Services -----"
          kubectl get svc -o wide
