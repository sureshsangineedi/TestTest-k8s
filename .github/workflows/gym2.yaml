name: gym2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: [self-hosted, windows]

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: gym2
      DOCKER_TAG: ${{ github.sha }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        shell: powershell
        run: |
          echo "Building Docker image..."

          docker build `
            --file appbox/gym2/Dockerfile `
            . `
            --tag "${{ env.IMAGE_NAME }}:local" `
            --tag "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}" `
            --tag "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

          echo "Docker image built successfully"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Push Docker Images
        shell: powershell
        run: |
          echo "Pushing images to Docker Hub..."

          docker push "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          docker push "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

          echo "Successfully pushed to Docker Hub"

      - name: Check Kubernetes Connection
        shell: powershell
        run: |
          echo "Checking Kubernetes connection..."

          kubectl config current-context
          kubectl get nodes

          echo "Kubernetes connection successful"

      - name: Deploy gym2 to Kubernetes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl apply -f appbox/gym2/k8s/deployment.yaml

          echo "gym2 deployment successful"

      - name: Check Deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/gym2-deployment

          echo "Deployment completed successfully"

          kubectl get deployment
          kubectl get pods

