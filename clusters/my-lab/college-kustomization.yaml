apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: college-app-ks          # 👈 must be indented by 2 spaces
  namespace: flux-system
spec:
  interval: 1m0s
  path: "./appbox/collegeapp"   # ✅ correct relative path to your app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system           # must match your GitRepository name
  validation: client
