apiVersion: apps/v1
kind: Deployment
metadata:
  name: info-deployment
  labels:
    app: info
spec:
  replicas: 2
  selector:
    matchLabels:
      app: info
  template:
    metadata:
      labels:
        app: info
    spec:
      containers:
        - name: info
          image: suresh2dev2/info
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: info-service
spec:
  type: NodePort
  selector:
    app: info
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
