apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironman-deployment
  labels:
    app: ironman
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ironman
  template:
    metadata:
      labels:
        app: ironman
    spec:
      containers:
        - name: ironman
          image: suresh2dev2/ironman
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: ironman-service
spec:
  type: NodePort
  selector:
    app: ironman
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
