apiVersion: apps/v1
kind: Deployment
metadata:
  name: ele-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ele-app
  template:
    metadata:
      labels:
        app: ele-app
    spec:
      containers:
      - name: ele-app
        image: suresh2dev2/ele-app:de8fa259620e8fa8b3fc992b8118fdd6e006365f
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ele-service
spec:
  type: NodePort
  selector:
    app: ele-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30031
