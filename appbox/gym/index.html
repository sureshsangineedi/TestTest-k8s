<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitZone Gym</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .hero {
      background: url('https://images.unsplash.com/photo-1554284126-aa88f22d8b74') center/cover no-repeat;
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }
    .hero h1 {
      font-size: 4rem;
      font-weight: 700;
    }
    .hero p {
      font-size: 1.3rem;
    }
    .btn-primary {
      background-color: #ff3d00;
      border: none;
    }
    .btn-primary:hover {
      background-color: #e63500;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">FitZone</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navmenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navmenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="#home" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
          <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <h1>Transform Your Body</h1>
    <p>Join FitZone — The Best Gym in Town</p>
    <a href="#contact" class="btn btn-primary btn-lg mt-3">Join Now</a>
  </section>

  <!-- About Section -->
  <section id="about" class="py-5 text-center">
    <div class="container">
      <h2>About FitZone</h2>
      <p class="lead">We help you reach your fitness goals with modern equipment, professional trainers, and a motivating environment.</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="py-5 bg-dark text-white text-center">
    <div class="container">
      <h2>Contact Us</h2>
      <p>Email: info@fitzone.com | Phone: +91 98765 43210</p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
