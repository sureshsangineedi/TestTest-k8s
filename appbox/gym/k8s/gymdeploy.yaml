apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-app
  labels:
    app: gym-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gym-app
  template:
    metadata:
      labels:
        app: gym-app
    spec:
      containers:
      - name: gym-app
        image: suresh2dev2/gym-app:latest  # replace with your image
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gym-app-service
spec:
  selector:
    app: gym-app
  type: NodePort   # For external access in most clusters
  ports:
  - protocol: TCP
    port: 8080         # External service port
    targetPort: 80     # Container port inside the pod
    nodePort: 30017    # Optional: specify NodePort (30000–32767 range)
