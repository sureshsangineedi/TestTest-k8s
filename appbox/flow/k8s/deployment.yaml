apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-deployment
  labels:
    app: flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flow
  template:
    metadata:
      labels:
        app: flow
    spec:
      containers:
        - name: flow
          image: suresh2dev2/flow
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: flow-service
spec:
  type: NodePort
  selector:
    app: flow
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
