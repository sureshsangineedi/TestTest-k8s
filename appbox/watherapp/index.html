<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .weather-app {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .search {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            width: calc(100% - 22px);
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .weather-info {
            margin-top: 20px;
        }

        p {
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div class="weather-app">
        <h1>Weather App</h1>
        <div class="search">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-btn">Search</button>
        </div>
        <div class="weather-info">
            <h2 id="city-name">City Name</h2>
            <p id="temperature">Temperature: --°C</p>
            <p id="weather-condition">Condition: --</p>
            <p id="humidity">Humidity: --%</p>
            <p id="wind-speed">Wind Speed: -- m/s</p>
        </div>
    </div>

    <script>
        // 84771b840f2b4bcbb1065825250803
        const apiKey = "11637f769f67fc2b6d97a96bf8c54044"; // Replace with your OpenWeatherMap API key
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchBox = document.querySelector("#city-input");
        const searchBtn = document.querySelector("#search-btn");
        const cityName = document.querySelector("#city-name");
        const temperature = document.querySelector("#temperature");
        const weatherCondition = document.querySelector("#weather-condition");
        const humidity = document.querySelector("#humidity");
        const windSpeed = document.querySelector("#wind-speed");

        async function checkWeather(city) {
            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
            const data = await response.json();

            if (response.status === 404) {
                alert("City not found. Please enter a valid city name.");
                return;
            }

            cityName.textContent = data.name;
            temperature.textContent = `Temperature: ${Math.round(data.main.temp)}°C`;
            windSpeed.textContent=`windspeed:${data.wind.speed}`;
            humidity.textContent=`Humidity:${data.main.humidity}`;
            weatherCondition.textContent=`condition:${data.weather[0].description}`;

        }

        searchBtn.addEventListener("click", () => {
            const city = searchBox.value.trim();
            if (city) {
                checkWeather(city);
            } else {
                alert("Please enter a city name.");
            }
        });

        searchBox.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                const city = searchBox.value.trim();
                if (city) {
                    checkWeather(city);
                } else {
                    alert("Please enter a city name.");
                }
            }
        });
    </script>
</body>

</html>
