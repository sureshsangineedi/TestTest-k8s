apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-demo-app
  template:
    metadata:
      labels:
        app: redis-demo-app
    spec:
      containers:
        - name: app
          image: suresh2dev2/redis-demo-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
  ---
  apiVersion: v1
kind: Service
metadata:
  name: redis-demo-app-service
spec:
  selector:
    app: redis-demo-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32000
  type: NodePort
