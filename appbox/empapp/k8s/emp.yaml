
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emp-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emp-app
  template:
    metadata:
      labels:
        app: emp-app
    spec:
      containers:
      - name: emp-app
        image: suresh2dev2/emp1-app:1.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: emp-service
spec:
  type: NodePort
  selector:
    app: emp-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30022
