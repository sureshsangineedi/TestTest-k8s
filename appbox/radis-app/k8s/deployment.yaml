apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-k8s-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-k8s-app
  template:
    metadata:
      labels:
        app: redis-k8s-app
    spec:
      containers:
        - name: app
          image: suresh2dev2/redis-k8s-app:latest
          ports:
            - containerPort: 3000
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-k8s-app-service
spec:
  type: NodePort
  selector:
    app: redis-k8s-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001   # Exposed NodePort
