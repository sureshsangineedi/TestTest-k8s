apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym2-deployment
  labels:
    app: gym2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gym2
  template:
    metadata:
      labels:
        app: gym2
    spec:
      containers:
        - name: gym2
          image: suresh2dev2/gym2
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: gym2-service
spec:
  type: NodePort
  selector:
    app: gym2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
