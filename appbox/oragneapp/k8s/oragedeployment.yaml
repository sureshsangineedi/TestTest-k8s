apiVersion: v1
kind: Service
metadata:
  name: orangefarm-service
  labels:
    app: orangefarm
spec:
  type: ClusterIP
  selector:
    app: orangefarm
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orangefarm-deployment
  labels:
    app: orangefarm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orangefarm
  template:
    metadata:
      labels:
        app: orangefarm
    spec:
      containers:
        - name: orangefarm
          image: <your-registry>/orangefarm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20

