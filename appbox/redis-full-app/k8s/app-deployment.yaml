apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-app
  template:
    metadata:
      labels:
        app: redis-app
    spec:
      containers:
      - name: redis-app
        image: yourdocker/redis-app:latest
        env:
        - name: REDIS_HOST
          value: "redis"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: redis-app-service
spec:
  type: NodePort
  selector:
    app: redis-app
  ports:
  - port: 3000
    nodePort: 30010
    targetPort: 3000
