apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-reminder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: water-reminder
  template:
    metadata:
      labels:
        app: water-reminder
    spec:
      containers:
      - name: water-reminder
        image: suresh2dev2/water-reminder:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: water-reminder-service
spec:
  type: NodePort
  selector:
    app: water-reminder
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30047
