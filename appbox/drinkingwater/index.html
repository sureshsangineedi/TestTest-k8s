<!DOCTYPE html>
<html>
<head>
  <title>Water Reminder</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }
    h1 {
      color: #0077cc;
    }
  </style>
</head>
<body>

  <h1>💧 Water Reminder App</h1>
  <p>You will be reminded every 2 hours</p>
  <h2 id="message">Stay hydrated!</h2>

  <script>
    function remind() {
      alert("💧 Time to drink water!");
      document.getElementById("message").innerText =
        "Last reminder: " + new Date().toLocaleTimeString();
    }

    // 2 hours = 2 * 60 * 60 * 1000 ms
    setInterval(remind, 2 * 60 * 60 * 1000);
  </script>

</body>
</html>
