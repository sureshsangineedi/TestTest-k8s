apiVersion: apps/v1
kind: Deployment
metadata:
  name: milkapp-deployment
  labels:
    app: milkapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: milkapp
  template:
    metadata:
      labels:
        app: milkapp
    spec:
      containers:
      - name: milkapp
        image: hashicorp/http-echo
        args:
        - "-text=milkapp"
        ports:
        - containerPort: 5678

