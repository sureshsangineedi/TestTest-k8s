apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnn-deployment
  labels:
    app: cnn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cnn
  template:
    metadata:
      labels:
        app: cnn
    spec:
      containers:
        - name: cnn
          image: suresh2dev2/cnn
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: cnn-service
spec:
  type: NodePort
  selector:
    app: cnn
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
